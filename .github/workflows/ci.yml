name: MoonDatalog CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install MoonBit CLI & Toolchain
      run: |
        curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
        echo "$HOME/.moon/bin" >> $GITHUB_PATH

    - name: Verify MoonBit Version
      run: moon version --all

    - name: Check Package & Dependencies
      run: moon check

    - name: Run Unit Tests & Formal Specifications
      run: moon test

    - name: Run Enterprise Rule Engine Demo
      run: moon run cmd/main

    - name: Run Evaluation Benchmark
      run: moon run cmd/bench
